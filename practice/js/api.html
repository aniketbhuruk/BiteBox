<body>
    <script>
        async function abcd(){
           for( let i=1;i<=5;i++);
            const resp = await fetch('https://jsonplaceholder.typicode.com/posts/2');
            if (!resp.ok){
                throw new Error('Request failed with statas ${resp.status}');
            }
            let data =await resp.json();
            console.log(data);
        }
        abcd();
    </script>
</body>
